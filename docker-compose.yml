# Usage:
#   cp .env.example .env && docker compose run --rm api python -m app.cli genkey >> .env
#   docker compose up --build        -> http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afterimage
      POSTGRES_USER: afterimage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterimage"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      AFTERIMAGE_DATABASE_URL: postgresql+psycopg://afterimage:${POSTGRES_PASSWORD}@db/afterimage
      AFTERIMAGE_MASTER_KEY: ${AFTERIMAGE_MASTER_KEY:?run "python -m app.cli genkey"}
      AFTERIMAGE_AUDIT_SECRET: ${AFTERIMAGE_AUDIT_SECRET:?}
      AFTERIMAGE_ADMIN_TOKEN: ${AFTERIMAGE_ADMIN_TOKEN:-}
      AFTERIMAGE_PUBLIC_BASE_URL: ${AFTERIMAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      AFTERIMAGE_CORS_ORIGINS: ${AFTERIMAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      AFTERIMAGE_TRUST_PROXY_HEADERS: "true"
    volumes: [storage:/data/storage]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256

  web:
    build:
      context: ./frontend
      args: { VITE_GITHUB_URL: "${VITE_GITHUB_URL:-https://github.com/kamransalahuddin}" }
    depends_on: [api]
    ports: ["8080:8080"]

volumes:
  pgdata:
  storage:
