server {
  listen 8080;
  server_tokens off;
  client_max_body_size 21m;
  root /usr/share/nginx/html;

  # Access logs never contain share tokens: they live in the URL fragment (#),
  # which browsers do not send. API paths are scrubbed by the backend itself.
  access_log off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
